name: P2 integer mass ABI exact closure validation
on:
  push:
    branches: [ci/p2-integer-mass-r17-20261114]
    paths: [.github/workflows/p2-integer-mass-validation.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: goldbach-p0-heavy
  cancel-in-progress: false
jobs:
  p2_integer_mass:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_COMMIT: 5073536258d3e796a7336ed0a5082c848d1ba709
      BASELINE_COMMIT: eb035a259f2f40853e9899f6d98af25852184fee
      EXPECTED_MANIFEST: 9febc925699cfb42479876970be20f6d25bcce86b0e47d76b9a8517621d75688
      LEAN_NUM_THREADS: 2
      P2_BUNDLE: docs/source-only/20261113-resume/p2-validation-v6
      CACHE_BUNDLE: docs/source-only/20261113-resume/coherent-cache-tools
      CACHE_SCOPE: P2_NATIVE_398
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind root-delivered selection and actual committed workflows
        run: |
          set -euo pipefail
          export LOGS="$RUNNER_TEMP/p2-integer-mass-evidence"
          mkdir -p "$LOGS"
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/p2_validation.py" select 2>&1 | tee "$LOGS/driver-selection.log"
          printf 'LOGS=%s\nCACHE_INPUTS=%s\nCACHE_CHECKPOINT_OUTPUT=%s\n' "$LOGS" "$RUNNER_TEMP/p2-cache-inputs" "$RUNNER_TEMP/p2-coherent-checkpoint" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eb035a259f2f40853e9899f6d98af25852184fee
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 686024b292027816b712963167436c445df5e68e
          path: proof-input
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 680fc11a47a9fb081fbf108cd007820e45656ab2
          path: repair-input
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a6aec20e831aa7f905533bec69fd0f86cd2bf9b1
          path: repair-next-input
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5073536258d3e796a7336ed0a5082c848d1ba709
          path: repair-r9-input
          persist-credentials: false
      - name: Bind repair baseline and exact ABI overlay with original generic stage
        id: materialize
        run: |
          set -euo pipefail
          export PROJECT="$GITHUB_WORKSPACE/candidate"
          export LOGS="$RUNNER_TEMP/p2-integer-mass-evidence"
          export BASELINE_SOURCE="$GITHUB_WORKSPACE/baseline"
          export ABI_SOURCE="$GITHUB_WORKSPACE/proof-input"
          export REPAIR_SOURCE="$GITHUB_WORKSPACE/repair-input"
          export REPAIR_NEXT_SOURCE="$GITHUB_WORKSPACE/repair-next-input"
          export REPAIR_R9_SOURCE="$GITHUB_WORKSPACE/repair-r9-input"
          export P2_SOURCE_VIEW="$RUNNER_TEMP/p2-integer-mass-source-view"
          export P2_VALIDATION_MANIFEST="$GITHUB_WORKSPACE/$P2_BUNDLE/P2_VALIDATION_MANIFEST.json"
          export P2_DIAGNOSTIC_AUDIT="$GITHUB_WORKSPACE/$P2_BUNDLE/reused/Round6Audit.lean"
          mkdir -p "$LOGS"
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/p2_validation.py" stage 2>&1 | tee "$LOGS/materialize.log"
          cmp "$PROJECT/lean-toolchain" lean-toolchain
          cmp "$PROJECT/lake-manifest.json" lake-manifest.json
          printf 'PROJECT=%s\nLOGS=%s\nBASELINE_SOURCE=%s\nABI_SOURCE=%s\nREPAIR_SOURCE=%s\nREPAIR_NEXT_SOURCE=%s\nREPAIR_R9_SOURCE=%s\nP2_SOURCE_VIEW=%s\nP2_VALIDATION_MANIFEST=%s\nP2_DIAGNOSTIC_AUDIT=%s\n' \
            "$PROJECT" "$LOGS" "$BASELINE_SOURCE" "$ABI_SOURCE" "$REPAIR_SOURCE" "$REPAIR_NEXT_SOURCE" "$REPAIR_R9_SOURCE" "$P2_SOURCE_VIEW" \
            "$P2_VALIDATION_MANIFEST" "$P2_DIAGNOSTIC_AUDIT" >> "$GITHUB_ENV"
      - name: Check out pinned existing lean-action scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean-action
          ref: f061402b660e0c34644504b324e830f2991d4865
          path: .ci-lean-action
          persist-credentials: false
      - name: Install pinned toolchain with unchanged existing scripts
        run: |
          set -euo pipefail
          test "$(git -C .ci-lean-action rev-parse HEAD)" = f061402b660e0c34644504b324e830f2991d4865
          LEAN_ACTION_DIR="$RUNNER_TEMP/lean-action-f061402b"
          mv .ci-lean-action "$LEAN_ACTION_DIR"
          printf 'LEAN_ACTION_DIR=%s\n' "$LEAN_ACTION_DIR" >> "$GITHUB_ENV"
          "$LEAN_ACTION_DIR/scripts/install_elan.sh" 2>&1 | tee "$LOGS/install-toolchain.log"
      - name: Install original guard plus explicitly hashed pre-exec cache admission
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/$CACHE_BUNDLE/cache_runtime_setup.py"
      - name: Acquire authentic bootstrap,407 and89 root inputs with the shared Range reader
        id: cache_acquisition
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          for phase in fixtures acquire; do
            python3 "$GITHUB_WORKSPACE/$CACHE_BUNDLE/coherent_cache.py" "$phase" 2>&1 | tee "$LOGS/cache-$phase.log"
          done
      - name: Reuse authentic Cache executable with stock no-build and bind dependency sources
        id: dependencies
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/$CACHE_BUNDLE/coherent_cache.py" bootstrap 2>&1 | tee "$LOGS/dependency-cache.log"
          cmp lake-manifest.json "$GITHUB_WORKSPACE/lake-manifest.json"
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          lock=json.loads(pathlib.Path('lake-manifest.json').read_text())
          receipt=[]
          for p in lock['packages']:
              d=pathlib.Path('.lake/packages')/p['name']
              os.environ['GIT_NO_LAZY_FETCH']='1'
              sha=subprocess.check_output(['git','-c','protocol.allow=never','-C',str(d),'rev-parse','HEAD'],text=True).strip()
              assert sha==p['rev'],(p['name'],sha,p['rev'])
              assert not subprocess.check_output(['git','-c','protocol.allow=never','-C',str(d),'diff','HEAD','--'],text=True)
              receipt.append({'name':p['name'],'sha':sha})
          pathlib.Path(os.environ['LOGS'],'dependencies.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Restore authentic407 package and89 root inputs; require stock no-build qualification
        id: cache_qualification
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          for phase in restore qualify; do
            python3 "$GITHUB_WORKSPACE/$CACHE_BUNDLE/coherent_cache.py" "$phase" 2>&1 | tee "$LOGS/cache-$phase.log"
          done
      - name: Prepare complete ABI import census with original strict diagnostic audit
        id: audit_prepare
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/prepare_p2_integer_mass_validation.py" prepare
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/p2_validation.py" bind
          python3 "$GITHUB_WORKSPACE/$CACHE_BUNDLE/coherent_cache.py" admit 2>&1 | tee "$LOGS/cache-admit.log"
      - name: Strict single-module FinitePi preflight before full102 compilation
        id: finitepi_pilot
        timeout-minutes: 35
        run: |
          set -euo pipefail
          cd "$PROJECT"
          lake --no-build build ImbalancedChen.FinitePiIntegral 2>&1 | tee "$LOGS/finitepi-build.log"
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/finitepi_pilot.py" before
          lake env lean -DwarningAsError=true FinitePiPilot.lean 2>&1 | tee "$LOGS/finitepi-types.log"
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/finitepi_pilot.py" verify
      - name: Compile only13 affected modules; preserve qualified89 inputs
        timeout-minutes: 200
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/finitepi_pilot.py" require
          mapfile -t modules < "$LOGS/recompile-modules.txt"
          test "${#modules[@]}" -eq 13
          lake build "${modules[@]}" 2>&1 | tee "$LOGS/batch-build.log"
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/prepare_p2_integer_mass_validation.py" snapshot
      - name: Replay all closure modules with original bundled kernel checker
        timeout-minutes: 100
        run: |
          set -euo pipefail
          cd "$PROJECT"
          mapfile -t modules < "$LOGS/modules.txt"
          lake env leanchecker --verbose "${modules[@]}" 2>&1 | tee "$LOGS/batch-checker.log"
      - name: Export every serialized declaration both full types and transitive axioms
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cd "$PROJECT"
          lake env lean -DwarningAsError=true CandidateAudit.lean 2>&1 | tee "$LOGS/batch-types.log"
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/prepare_p2_integer_mass_validation.py" verify
      - name: Audit unchanged actual trust-zero 12 GiB runtime
        if: ${{ always() && steps.materialize.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/reused/ci_runtime_guard.py" audit --probe --require-source 2>&1 | tee "$LOGS/runtime-audit.log"
      - name: Audit immutable407 cache inputs and zero protected source compiler events
        if: ${{ always() && steps.cache_qualification.outcome == 'success' && steps.audit_prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/$CACHE_BUNDLE/coherent_cache.py" audit 2>&1 | tee "$LOGS/cache-final-audit.log"
      - name: Upload early lightweight logs before full object compression
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-integer-mass-lightlogs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p2-integer-mass-evidence/*.log
            ${{ runner.temp }}/p2-integer-mass-evidence/*.json
            ${{ runner.temp }}/p2-integer-mass-evidence/*.jsonl
            ${{ runner.temp }}/p2-integer-mass-evidence/*.txt
            ${{ runner.temp }}/p2-integer-mass-evidence/*.lean
            ${{ runner.temp }}/p2-integer-mass-evidence/runtime/
            ${{ runner.temp }}/p2-integer-mass-evidence/cache-processes/*.json
            ${{ runner.temp }}/p2-integer-mass-evidence/cache-processes/*.stderr
            ${{ runner.temp }}/p2-integer-mass-evidence/cache-processes/bootstrap-*.stdout
          if-no-files-found: error
          retention-days: 30
      - name: Preserve full raw native/setup/IR/source checkpoint with original collector
        if: ${{ always() && steps.materialize.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/$CACHE_BUNDLE/coherent_cache.py" retain
      - name: Upload original-collector coherent checkpoint including partial failure bytes
        if: ${{ always() && steps.materialize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-coherent-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/p2-coherent-checkpoint/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain actual final compiled objects sources and failure evidence
        if: ${{ always() && steps.materialize.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/p2_validation.py" retain
      - name: Bind final ABI-only acceptance after every original gate
        if: ${{ success() }}
        run: python3 "$GITHUB_WORKSPACE/$P2_BUNDLE/p2_validation.py" finalize
      - name: Retain full exact object archive and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-integer-mass-abi-${{ github.run_id }}
          path: ${{ runner.temp }}/p2-integer-mass-evidence/
          if-no-files-found: error
          retention-days: 30
