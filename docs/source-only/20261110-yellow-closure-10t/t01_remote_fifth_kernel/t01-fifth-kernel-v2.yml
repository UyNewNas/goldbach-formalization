name: T01 exact fifth-floor kernel verification v2
on:
  push:
    branches: [codex/yellow-closure-20261110]
    paths: [.github/workflows/t01-fifth-kernel.yml]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact published 40-character source commit
        required: true
        type: string
      manifest_sha256:
        description: Independently reviewed exact manifest SHA256
        required: true
        type: string
      purpose:
        description: Source gate; green still requires independent expanded-type acceptance
        required: true
        default: yellow_green
        type: choice
        options: [source_validation, yellow_green]
permissions:
  contents: read
concurrency:
  group: goldbach-p0-heavy
  cancel-in-progress: false
jobs:
  fifth:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
      EXPECTED_MANIFEST: ${{ inputs.manifest_sha256 || 'ab3a852493e4f49ed056a9d815f245bafbf58800234bc96bffb83f2472d25a75' }}
      CHECK_PURPOSE: ${{ inputs.purpose || 'yellow_green' }}
      LEAN_NUM_THREADS: 2
      T01: docs/source-only/20261110-yellow-closure-10t/t01_remote_fifth_kernel
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate immutable source identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Materialize exact fifth target, original binary and frozen review pins
        id: materialize
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf '%s  %s\n' "$EXPECTED_MANIFEST" "$T01/EXACT_INSTALL_MANIFEST-v2.json" | sha256sum --check --strict
          PROJECT="$RUNNER_TEMP/t01-project"
          LOGS="$RUNNER_TEMP/t01-evidence"
          mkdir -p "$LOGS"
          printf 'PROJECT=%s\nLOGS=%s\n' "$PROJECT" "$LOGS" >> "$GITHUB_ENV"
          python3 "$T01/stage_project_v2.py" --dest "$PROJECT" --purpose "$CHECK_PURPOSE" | tee "$LOGS/materialize.log"
          cp "$PROJECT/T01_PROVENANCE.json" "$PROJECT/T01Audit.lean" "$T01/EXACT_INSTALL_MANIFEST-v2.json" "$T01/REUSE_EVIDENCE.json" "$LOGS/"
      - name: Check out pinned existing lean-action scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean-action
          ref: f061402b660e0c34644504b324e830f2991d4865
          path: .ci-lean-action
          persist-credentials: false
      - name: Install pinned toolchain with existing scripts
        run: |
          set -euo pipefail
          test "$(git -C .ci-lean-action rev-parse HEAD)" = f061402b660e0c34644504b324e830f2991d4865
          LEAN_ACTION_DIR="$RUNNER_TEMP/lean-action-f061402b"
          mv .ci-lean-action "$LEAN_ACTION_DIR"
          printf 'LEAN_ACTION_DIR=%s\n' "$LEAN_ACTION_DIR" >> "$GITHUB_ENV"
          "$LEAN_ACTION_DIR/scripts/install_elan.sh" 2>&1 | tee "$LOGS/install-toolchain.log"
      - name: Install unchanged successful 12 GiB serial trust-zero runtime guard
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/$T01/ci_runtime_guard.py" setup --evidence "$LOGS/runtime"
      - name: Reuse pinned dependency cache and bind dependency sources
        id: dependencies
        timeout-minutes: 35
        run: |
          set -euo pipefail
          cd "$PROJECT"
          lake exe cache get 2>&1 | tee "$LOGS/dependency-cache.log"
          cmp lake-manifest.json "$GITHUB_WORKSPACE/lake-manifest.json"
          python3 "$GITHUB_WORKSPACE/$T01/record_dependencies.py" --project "$PROJECT" --manifest "$GITHUB_WORKSPACE/$T01/EXACT_INSTALL_MANIFEST-v2.json" --output "$LOGS/dependencies.json"
      - name: Elaborate all exact fifth suppliers and eight complete theorem types
        id: build
        timeout-minutes: 240
        run: |
          set -euo pipefail
          cd "$PROJECT"
          lake build T01Audit 2>&1 | tee "$LOGS/build.log"
      - name: Export exact raw complete types from the built target objects
        id: types
        run: |
          set -euo pipefail
          cd "$PROJECT"
          lake env lean T01Audit.lean 2>&1 | tee "$LOGS/types-axioms.log"
      - name: Bind all exact source and compiled object identities before kernel check
        id: objects_before
        run: |
          set -euo pipefail
          python3 "$T01/record_objects.py" --project "$PROJECT" --manifest "$T01/EXACT_INSTALL_MANIFEST-v2.json" --output "$LOGS/objects-before.json"
      - name: Replay every selected mathematical supplier with bundled leanchecker
        id: checker
        timeout-minutes: 35
        run: |
          set -euo pipefail
          cd "$PROJECT"
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          mapfile -t modules < <(python3 - <<'PY'
          import json, os, pathlib
          m = json.loads((pathlib.Path(os.environ['GITHUB_WORKSPACE']) / os.environ['T01'] / 'EXACT_INSTALL_MANIFEST-v2.json').read_text())
          print('\n'.join(m['targets'][0]['closure_modules'] + ['T01Audit']))
          PY
          )
          test "${#modules[@]}" = 730
          lake env leanchecker --verbose "${modules[@]}" 2>&1 | tee "$LOGS/kernel-checker.log"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          m = json.loads((pathlib.Path(os.environ['GITHUB_WORKSPACE']) / os.environ['T01'] / 'EXACT_INSTALL_MANIFEST-v2.json').read_text())
          logs = pathlib.Path(os.environ['LOGS'])
          raw = (logs / 'kernel-checker.log').read_bytes()
          expected = m['targets'][0]['closure_modules'] + ['T01Audit']
          actual = [line.removeprefix('replaying ') for line in raw.decode().splitlines() if line.startswith('replaying ')]
          if len(actual) != len(expected) or set(actual) != set(expected):
              raise SystemExit('Missing, duplicate or unexpected mathematical module replay')
          result = {'status': 'PASS_ALL_729_SELECTED_PROJECT_MODULES_REPLAYED_RELATIVE_TO_IMPORTS', 'modules': actual, 'count': len(actual), 'fresh_external_closure_claimed': False, 'source_commit': os.environ['SOURCE_COMMIT'], 'manifest_sha256': os.environ['EXPECTED_MANIFEST'], 'log_sha256': hashlib.sha256(raw).hexdigest()}
          (logs / 'KERNEL_MODULE_RESULT.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Require exactly eight unelided types and matching transitive axiom reports
        id: axioms
        run: |
          set -euo pipefail
          python3 "$T01/audit_remote_output.py" --project "$PROJECT" --log "$LOGS/types-axioms.log" | tee "$LOGS/type-axiom-audit.log"
          cp "$PROJECT/T01_TYPE_AXIOM_RESULT.json" "$LOGS/"
      - name: Require unchanged source and object identities after all checks
        id: objects_after
        run: |
          set -euo pipefail
          python3 "$T01/record_objects.py" --project "$PROJECT" --manifest "$T01/EXACT_INSTALL_MANIFEST-v2.json" --output "$LOGS/objects-after.json" --compare "$LOGS/objects-before.json"
      - name: Audit actual source compiler commands and pinned runtime
        id: runtime
        if: ${{ always() && steps.materialize.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 "$GITHUB_WORKSPACE/$T01/ci_runtime_guard.py" audit --probe --require-source 2>&1 | tee "$LOGS/runtime-audit.log"
      - name: Require every evidence stage without promoting conditional scope
        if: ${{ always() }}
        env:
          MATERIALIZE: ${{ steps.materialize.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TYPES: ${{ steps.types.outcome }}
          OBJECTS_BEFORE: ${{ steps.objects_before.outcome }}
          CHECKER: ${{ steps.checker.outcome }}
          AXIOMS: ${{ steps.axioms.outcome }}
          OBJECTS_AFTER: ${{ steps.objects_after.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t01-evidence"
          python3 - <<'PY'
          import json, os, pathlib
          keys = ['MATERIALIZE', 'DEPENDENCIES', 'BUILD', 'TYPES', 'OBJECTS_BEFORE', 'CHECKER', 'AXIOMS', 'OBJECTS_AFTER', 'RUNTIME']
          result = {'source_commit': os.environ['SOURCE_COMMIT'], 'manifest_sha256': os.environ['EXPECTED_MANIFEST'], 'target': 'fifth_floor', 'purpose': os.environ['CHECK_PURPOSE'], 'outcomes': {k: os.environ[k] for k in keys}, 'green': False, 'independent_expanded_type_acceptance_required': True}
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 't01-evidence/outcomes.json'
          path.write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          if any(result['outcomes'][k] != 'success' for k in keys):
              raise SystemExit('A required exact-source gate failed or was skipped')
          PY
      - name: Hash retained evidence files including failure logs
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t01-evidence"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 't01-evidence'
          records = {p.relative_to(root).as_posix(): {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'EVIDENCE_FILES.json'}
          (root / 'EVIDENCE_FILES.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
      - name: Retain exact-source kernel, type, runtime and object evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t01-fifth-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t01-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
