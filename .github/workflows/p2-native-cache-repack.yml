          path: ${{ runner.temp }}/p2-native-cache-repack/packets/part-003.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain original byte packet 004
        if: ${{ success() && steps.packets.outputs.part_004 == 'true' }}
