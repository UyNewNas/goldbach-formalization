      - name: Retain original byte packet 009
        if: ${{ success() && steps.packets.outputs.part_009 == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-native-cache-${{ github.run_id }}-${{ github.run_attempt }}-009
          path: ${{ runner.temp }}/p2-native-cache-repack/packets/part-009.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain byte transport summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-native-cache-${{ github.run_id }}-${{ github.run_attempt }}-summary
          path: ${{ runner.temp }}/p2-native-cache-repack/packets/SUMMARY.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

