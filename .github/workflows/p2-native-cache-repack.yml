      - name: Retain original byte packet 006
        if: ${{ success() && steps.packets.outputs.part_006 == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-native-cache-${{ github.run_id }}-${{ github.run_attempt }}-006
          path: ${{ runner.temp }}/p2-native-cache-repack/packets/part-006.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain original byte packet 007
        if: ${{ success() && steps.packets.outputs.part_007 == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-native-cache-${{ github.run_id }}-${{ github.run_attempt }}-007
          path: ${{ runner.temp }}/p2-native-cache-repack/packets/part-007.zip
          compression-level: 0
          if-no-files-found: error
