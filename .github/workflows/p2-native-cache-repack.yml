          path: ${{ runner.temp }}/p2-native-cache-repack/packets/part-004.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain original byte packet 005
        if: ${{ success() && steps.packets.outputs.part_005 == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
