name: P3.1 family scale budget

on:
  push:
    branches: [work/p3-1-proof-20261126]
    paths:
      - 'ImbalancedChen/**/*.lean'
      - 'verification/p31_family_scale_intake.py'
      - 'verification/build_part3_pinned_closure.py'
      - 'verification/test_p31_family_scale_build.py'
      - 'verification/test_part3_source_object_gate.py'
      - 'verification/verify_part3_distribution.py'
      - 'verification/verify_variable_envelope_boxes.py'
      - 'verification/Part3DistributionAudit.lean'
      - 'docs/part3-distribution/p31-family-scale-budget-20261127/PROJECT_IMPORT_CLOSURE.json'
      - 'docs/part3-distribution/p31-family-scale-budget-20261127/SOURCE_INTAKE.json'
      - 'docs/part3-distribution/p31-family-scale-budget-20261127/FAMILY_SCALE_PROVENANCE.json'
      - 'docs/part3-distribution/p31-actual-mass-budget-20261127/PROJECT_IMPORT_CLOSURE.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'verification/verify_part3_continuation.py'
      - '.github/workflows/p3-1-family-scale.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p31-family-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  family-scale:
    if: github.ref == 'refs/heads/work/p3-1-proof-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - name: Check out the exact submitted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source and frozen-pin preflight
        run: |
          python3 verification/verify_part3_continuation.py --source-only --group family-scale-budget \
            --output-dir "$RUNNER_TEMP/p31-family-scale"
      - name: Check family intake and direct-build regressions
        run: python3 -B -W error verification/test_p31_family_scale_build.py
      - name: Check out pinned toolchain installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean-action
          ref: f061402b660e0c34644504b324e830f2991d4865
          path: .ci-lean-action
          persist-credentials: false
      - name: Install the unchanged pinned Lean
        run: |
          set -euo pipefail
          test "$(git -C .ci-lean-action rev-parse HEAD)" = f061402b660e0c34644504b324e830f2991d4865
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          installer="$RUNNER_TEMP/p31-lean-action-f061402b"
          mv .ci-lean-action "$installer"
          "$installer/scripts/install_elan.sh" 2>&1 | tee "$RUNNER_TEMP/p31-family-scale/install.log"
      - name: Restore the accepted base Lake cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-Linux-X64-d450b2731e0e580dd4810dc06549d62b51dd63f81f1e56526d8ca765965a4618-61a3b1a855fb0d2910782499918e9924f5abf5dad42616522ef96e26cf7641ca-96d8c62edc5f8e4c196441ab680bcf34b1dcbe8a
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}
      - name: Fetch pinned Mathlib cache
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/p31-family-scale/mathlib-cache.log"
      - name: Strict compile, kernel replay and complete declaration audit
        run: |
          python3 verification/verify_part3_continuation.py --group family-scale-budget \
            --expected-head "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/p31-family-scale"
      - name: Retain original evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p31-family-scale-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p31-family-scale/
          if-no-files-found: error
          retention-days: 30
      - name: Emit portable report and proof logs
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, os, zipfile
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'p31-family-scale'
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(out.rglob('*')):
                  if p.is_file() and p.name not in {'install.log', 'mathlib-cache.log'}:
                      z.writestr(p.relative_to(out).as_posix(), p.read_bytes())
          payload = buf.getvalue()
          print('P31_EVIDENCE_SHA256 ' + hashlib.sha256(payload).hexdigest())
          encoded = base64.b64encode(payload).decode()
          for offset in range(0, len(encoded), 8192):
              print(f'P31_FAMILY_EVIDENCE_CHUNK {offset // 8192:06d} {encoded[offset:offset+8192]}')
          PY
