name: P2.10 logical module identity probe
on:
  push:
    branches: [codex-p210-metadata-diagnostic-20261125]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p210-metadata-diagnostic
  cancel-in-progress: false

jobs:
  metadata:
    if: ${{ github.ref == 'refs/heads/codex-p210-metadata-diagnostic-20261125' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      LEAN_NUM_THREADS: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean-action
          ref: f061402b660e0c34644504b324e830f2991d4865
          path: .ci-lean-action
          persist-credentials: false
      - name: Install pinned Lean and reuse public Mathlib dependencies
        run: |
          set -euo pipefail
          mkdir -p .lake/p210-lake-probe
          test "$(git -C .ci-lean-action rev-parse HEAD)" = f061402b660e0c34644504b324e830f2991d4865
          mv .ci-lean-action "$RUNNER_TEMP/p210-lean-action"
          "$RUNNER_TEMP/p210-lean-action/scripts/install_elan.sh" 2>&1 | tee .lake/p210-lake-probe/install.log
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s  %s\n' e8baaa71855a616dc351028f3ad2200051b0671f423a1696a100e809302d5550 "$(elan which lean)" | sha256sum --check
          lake exe cache get Mathlib.Data.Fin.VecNotation Mathlib.Tactic 2>&1 | tee .lake/p210-lake-probe/mathlib-cache.log
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = e4c91783ca8e6a7c693ae624ade32fd22d4e43c1
      - name: Recover the logical identity of one finite schema with ordinary Lake
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          module='ImbalancedChen.P2Winner9CompleteSeedTypes'
          source=Path('ImbalancedChen/P2Winner9CompleteSeedTypes.lean')
          assert source.is_symlink()
          source_sha=hashlib.sha256(source.read_bytes()).hexdigest()
          assert source_sha=='c291fe7225785a7b52807f7c799ccafbd7aae00c9944848785fd5cb8411be34d'
          print('Source physical path:',source.resolve().relative_to(Path.cwd()))
          command=['lake','--verbose','build',module]
          with Path('.lake/p210-lake-probe/lake.log').open('w') as log:
              result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT)
          print(Path('.lake/p210-lake-probe/lake.log').read_text()[-16000:])
          obj=Path('.lake/build/lib/lean/ImbalancedChen/P2Winner9CompleteSeedTypes.olean')
          actual=hashlib.sha256(obj.read_bytes()).hexdigest() if obj.is_file() else None
          expected='e1245dded95daf773f6497e870eeba17a2c6fce0eae7ef9d851abd315849a5ef'
          info={'module':module,'source_sha256':source_sha,'source_symlink':os.readlink(source),
                'source_physical_path':str(source.resolve().relative_to(Path.cwd())),
                'command':command,'exit_code':result.returncode,'object_sha256':actual,
                'historical_object_sha256':expected,'historical_exact_match':actual==expected,
                'environment_recovery_only':True,'new_mathematical_credit':0,'old_numerical_rows_replayed':0,
                'accepted_records_modified':False,'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID']}
          Path('.lake/p210-lake-probe/result.json').write_text(json.dumps(info,sort_keys=True,indent=2)+'\n')
          print(json.dumps(info,sort_keys=True))
          assert result.returncode==0 and actual==expected,'Logical Lake object has not matched the accepted historical SHA'
          PY
      - name: Preserve the ordinary build result and its actual setup for reuse
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p210-lake-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lake/p210-lake-probe/
            .lake/build/lib/lean/ImbalancedChen/P2Winner9CompleteSeedTypes.*
            .lake/build/ir/ImbalancedChen/P2Winner9CompleteSeedTypes*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
