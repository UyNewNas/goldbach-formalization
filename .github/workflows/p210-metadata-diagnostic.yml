name: P2.10 existing object metadata diagnostic
on:
  push:
    branches: [codex-p210-metadata-diagnostic-20261125]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p210-metadata-diagnostic
  cancel-in-progress: false

jobs:
  metadata:
    if: ${{ github.ref == 'refs/heads/codex-p210-metadata-diagnostic-20261125' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean-action
          ref: f061402b660e0c34644504b324e830f2991d4865
          path: .ci-lean-action
          persist-credentials: false
      - name: Install only the pinned Lean runtime
        run: |
          set -euo pipefail
          mkdir -p .lake/p210-metadata/inputs .lake/p210-metadata/outputs
          test "$(git -C .ci-lean-action rev-parse HEAD)" = f061402b660e0c34644504b324e830f2991d4865
          .ci-lean-action/scripts/install_elan.sh 2>&1 | tee .lake/p210-metadata/install.log
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s  %s\n' e8baaa71855a616dc351028f3ad2200051b0671f423a1696a100e809302d5550 "$(elan which lean)" | sha256sum --check
      - name: Retrieve two existing public objects without mathematical compilation
        run: |
          set -euo pipefail
          python3 verification/part2/p210_metadata/range_zip_member.py \
            --repo UyNewNas/goldbach-formalization --artifact 15005185154 --archive-size 414020349 \
            --member ImbalancedChen/P2Winner9CompleteSeedTypes.olean \
            --sha256 a7e9efa12315967da14c6eb8a539ee7257a5b8f37a8d0e3472c5dc72075e0129 \
            --out .lake/p210-metadata/inputs/SeedTypes.olean --metadata .lake/p210-metadata/seed-input.json
          python3 verification/part2/p210_metadata/range_zip_member.py \
            --repo UyNewNas/goldbach-formalization --artifact 15005185154 --archive-size 414020349 \
            --member ImbalancedChen/P2AffineSimplexMomentLaw.olean \
            --sha256 174eb506899dccaa4703b14509fda69d67c0304c5f07caae095c402377933655 \
            --out .lake/p210-metadata/inputs/Affine.olean --metadata .lake/p210-metadata/affine-input.json
      - name: Serialize unchanged data and one package entry change using core Lean
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('.lake/p210-metadata')
          cases=[('SeedTypes','ImbalancedChen.P2Winner9CompleteSeedTypes','e1245dded95daf773f6497e870eeba17a2c6fce0eae7ef9d851abd315849a5ef'),
                 ('Affine','ImbalancedChen.P2AffineSimplexMomentLaw','5d97c37e169d8c69617c89f88a5dd471134d58ca35a5137b3ce23e82b47cfc9f')]
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
          results=[]
          for short,module,expected in cases:
              src=root/'inputs'/(short+'.olean');out=root/'outputs'/(short+'.olean')
              command=['lean','-t0','-j1','-M2048','--run','verification/part2/p210_metadata/RetagPackage.lean',module,str(src),str(out)]
              with (root/(short+'.log')).open('w') as log:
                  result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT)
              item={'module':module,'exit_code':result.returncode,'input_sha256':sha(src),
                    'roundtrip_sha256':sha(Path(str(out)+'.roundtrip')),'candidate_sha256':sha(out),
                    'historical_sha256':expected,'historical_exact_match':sha(out)==expected,
                    'mathematical_source_compilations':0,'proof_credit':0,'registry_modified':False}
              item['roundtrip_identical']=item['roundtrip_sha256']==item['input_sha256']
              results.append(item)
              print((root/(short+'.log')).read_text())
              print(json.dumps(item,sort_keys=True))
          (root/'result.json').write_text(json.dumps(results,sort_keys=True,indent=2)+'\n')
          if not all(r['exit_code']==0 and r['roundtrip_identical'] and r['historical_exact_match'] for r in results):
              raise SystemExit('Historical byte identity not established for every case; retain diagnostics, do not alter any accepted record.')
          PY
      - name: Preserve original inputs and diagnostic outputs without proof credit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p210-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/p210-metadata/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
