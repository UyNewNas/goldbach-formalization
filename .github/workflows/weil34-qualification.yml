name: Weil timeout original checkpoint bounded evidence only
on:
  push:
    branches: [ci/weil-formalalgebra-20261115]
    paths: [.github/workflows/weil34-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: goldbach-p0-heavy
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact producer and acquire bounded raw checkpoint receipts without compilation
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/weil-timeout-evidence
        run: python3 docs/source-only/20261115-weil-timeout-evidence/acquire_receipts.py
      - name: Preserve raw evidence only with no proof or reuse credit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weil-timeout-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/weil-timeout-evidence/
          if-no-files-found: error
          retention-days: 30
