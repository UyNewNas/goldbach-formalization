name: P3 continuation verification

on:
  push:
    branches: [codex/p3-continuation-20261124, codex/p3-5-full-kernel-20261125]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-continuation-${{ github.ref }}-${{ github.ref == 'refs/heads/codex/p3-5-full-kernel-20261125' && 'latest' || github.sha }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.select.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: github.ref != 'refs/heads/codex/p3-5-full-kernel-20261125'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed proof groups
        id: select
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          before=os.environ.get('BEFORE','')
          groups=['spectral','proper-power']
          if os.environ['GITHUB_REF'] == 'refs/heads/codex/p3-5-full-kernel-20261125':
              groups=['p35-continuous-l2']
          elif before and set(before) != {'0'}:
              changed=subprocess.check_output(['git','diff','--name-only',before,os.environ['GITHUB_SHA']],text=True).splitlines()
              validators=any(p.startswith('verification/') or p in ['lean-toolchain','lakefile.toml','lake-manifest.json','.github/workflows/part3-continuation.yml'] for p in changed)
              lean=[p for p in changed if p.endswith('.lean')]
              selected=[]
              if any('/Part3ExceptionalWeight' in p for p in lean): selected.append('spectral')
              if any('/Part3ProperPower' in p or '/Part3SignedModulusPayment' in p for p in lean): selected.append('proper-power')
              known=all('/Part3ExceptionalWeight' in p or '/Part3ProperPower' in p or '/Part3SignedModulusPayment' in p for p in lean)
              if selected and known and not validators: groups=selected
              print({'changed':changed,'groups':groups})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('groups='+json.dumps(groups)+'\n')
          PY
  continuation:
    name: P3 ${{ matrix.group }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ github.ref == 'refs/heads/codex/p3-5-full-kernel-20261125' && 1 || 2 }}
      matrix:
        group: ${{ fromJSON(needs.scope.outputs.groups) }}
    env:
      LEAN_NUM_THREADS: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact continuation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ matrix.group == 'p35-continuous-l2' && 1 || 0 }}
          filter: ${{ matrix.group == 'p35-continuous-l2' && 'blob:none' || '' }}
          persist-credentials: false
      - name: Fetch this proof commit's ancestry for the baseline check
        if: matrix.group == 'p35-continuous-l2'
        run: git fetch --no-tags --filter=blob:none --unshallow origin "$GITHUB_SHA"
      - name: Source and frozen-pin preflight
        run: |
          python3 verification/verify_part3_continuation.py --source-only --group "${{ matrix.group }}" \
            --output-dir "$RUNNER_TEMP/p3-continuation-verification"
      - name: Check out the existing pinned lean-action installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean-action
          ref: f061402b660e0c34644504b324e830f2991d4865
          path: .ci-lean-action
          persist-credentials: false
      - name: Install the unchanged project toolchain
        run: |
          set -euo pipefail
          test "$(git -C .ci-lean-action rev-parse HEAD)" = f061402b660e0c34644504b324e830f2991d4865
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          installer="$RUNNER_TEMP/p3-lean-action-f061402b"
          mv .ci-lean-action "$installer"
          "$installer/scripts/install_elan.sh" 2>&1 | tee "$RUNNER_TEMP/p3-continuation-verification/install.log"
      - name: Restore compatible existing Lake objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}
      - name: Fetch pinned Mathlib cache
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/p3-continuation-verification/mathlib-cache.log"
      - name: Verify only the new P3 modules
        run: |
          python3 verification/verify_part3_continuation.py \
            --group "${{ matrix.group }}" \
            --expected-head "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/p3-continuation-verification"
      - name: Retain actual verification records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-continuation-${{ matrix.group }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p3-continuation-verification/
          if-no-files-found: error
          retention-days: 30
      - name: Check capacity for the reusable dependency cache
        id: cache-space
        if: ${{ !cancelled() && (matrix.group == 'proper-power' || matrix.group == 'p35-continuous-l2') }}
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root=Path('.lake')
          size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) if root.exists() else 0
          free=shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          ok=bool(size and free > size + 2*1024**3)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('save='+str(ok).lower()+'\n')
          print({'cache_bytes':size,'free_bytes':free,'save':ok})
          PY
      - name: Preserve compiled dependencies for follow-up proof fixes
        if: ${{ !cancelled() && (matrix.group == 'proper-power' || matrix.group == 'p35-continuous-l2') && steps.cache-space.outputs.save == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}
