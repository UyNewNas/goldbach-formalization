name: P3.1 original common interface

on:
  push:
    branches: [work/p3-1-interface-20261125]
    paths:
      - 'ImbalancedChen/Part3CommonCompletedInterface.lean'
      - 'verification/verify_part3_continuation.py'
      - '.github/workflows/p3-1-interface.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p31-interface-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - name: Check out the exact submitted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source and frozen-pin preflight
        run: |
          python3 verification/verify_part3_continuation.py --source-only --group interface \
            --output-dir "$RUNNER_TEMP/p31-interface"
      - name: Check out pinned toolchain installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean-action
          ref: f061402b660e0c34644504b324e830f2991d4865
          path: .ci-lean-action
          persist-credentials: false
      - name: Install the unchanged pinned Lean
        run: |
          set -euo pipefail
          test "$(git -C .ci-lean-action rev-parse HEAD)" = f061402b660e0c34644504b324e830f2991d4865
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          installer="$RUNNER_TEMP/p31-lean-action-f061402b"
          mv .ci-lean-action "$installer"
          "$installer/scripts/install_elan.sh" 2>&1 | tee "$RUNNER_TEMP/p31-interface/install.log"
      - name: Restore compatible existing Lake objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}
      - name: Fetch pinned Mathlib cache
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/p31-interface/mathlib-cache.log"
      - name: Strict compile, kernel replay and complete declaration audit
        run: |
          python3 verification/verify_part3_continuation.py --group interface \
            --expected-head "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/p31-interface"
      - name: Retain original evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p31-interface-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p31-interface/
          if-no-files-found: error
          retention-days: 30
      - name: Emit portable report and proof logs
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, os, zipfile
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'p31-interface'
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(out.rglob('*')):
                  if p.is_file() and p.name not in {'install.log', 'mathlib-cache.log'}:
                      z.writestr(p.relative_to(out).as_posix(), p.read_bytes())
          payload = buf.getvalue()
          print('P31_EVIDENCE_SHA256 ' + hashlib.sha256(payload).hexdigest())
          print('P31_EVIDENCE_BASE64 ' + base64.b64encode(payload).decode())
          PY
