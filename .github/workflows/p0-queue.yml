name: P0 finite verification queue
on:
  push:
    branches:
      - 'codex/chen-parts-integration'
    paths:
      - 'automation/dispatch.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goldbach-p0-heavy
  cancel-in-progress: false
jobs:
  finite:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/chen-parts-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned lean-action setup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean-action
          ref: f061402b660e0c34644504b324e830f2991d4865
          path: .ci-lean-action
          persist-credentials: false
      - name: Install the unchanged pinned toolchain
        run: |
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          .ci-lean-action/scripts/install_elan.sh
      - name: Restore exact successful baseline cache
        id: baseline-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-Linux-X64-d450b2731e0e580dd4810dc06549d62b51dd63f81f1e56526d8ca765965a4618-61a3b1a855fb0d2910782499918e9924f5abf5dad42616522ef96e26cf7641ca-59d338b93b2347021237eb51293bb934a316909d
          fail-on-cache-miss: true
      - name: Verify selected finite requests serially
        id: verify
        env:
          P0_CACHE_HIT: ${{ steps.baseline-cache.outputs.cache-hit }}
          P0_CACHE_MATCHED_KEY: ${{ steps.baseline-cache.outputs.cache-matched-key }}
          CHEN_HEAVY_LOCK_PATH: ${{ runner.temp }}/goldbach-p0-heavy.lock
        run: |
          set -euo pipefail
          test "$P0_CACHE_HIT" = true
          mkdir -p .lake/p0-queue
          python3 - <<'PY'
          import json,pathlib
          req=json.load(open('automation/dispatch.json'))
          assert req['owner']=='P0' and req['baseline']=='1337e2db4712fb4a9f86add073f771f84b66d0c8'
          assert 1 <= len(req['requests']) <= 2
          for i,r in enumerate(req['requests']):
            pathlib.Path(f'.lake/p0-queue-request-{i}.json').write_text(json.dumps(r))
          PY
          result=0
          for request in .lake/p0-queue-request-*.json; do
            python3 verification/parts/p0/queue/run.py "$request" || result=1
          done
          exit "$result"
      - name: Preserve all original diagnostics and hashes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-finite-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/p0-queue/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
