name: P3.2 selected proof composition

on:
  push:
    branches: [work/p3-2-proof-20261125]
    paths:
      - 'ImbalancedChen/**/*.lean'
      - 'verification/**/*.py'
      - 'verification/Part3DistributionAudit.lean'
      - 'docs/part3-distribution/node32-20261125/CLOSURE.json'
      - 'docs/part3-distribution/node32-20261125/SOURCE_REUSE.json'
      - 'docs/part3-distribution/node32-20261125/HISTORICAL_REUSE.json'
      - '.github/workflows/part3-node32.yml'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-node32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node32:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - name: Check out the exact P3.2 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source closure and frozen dependency pins
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p3-node32"
          python3 -B -m unittest discover -s verification -p test_part3_node32_gate.py -v 2>&1 | tee "$RUNNER_TEMP/p3-node32/gate-tests.log"
          python3 -B verification/verify_part3_node32_reuse.py | tee "$RUNNER_TEMP/p3-node32/history-source-match.json"
          python3 verification/verify_part3_continuation.py --source-only --group node32 --output-dir "$RUNNER_TEMP/p3-node32"
      - name: Check out the existing pinned Lean installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/lean-action
          ref: f061402b660e0c34644504b324e830f2991d4865
          path: .ci-lean-action
          persist-credentials: false
      - name: Install the unchanged compiler
        run: |
          set -euo pipefail
          test "$(git -C .ci-lean-action rev-parse HEAD)" = f061402b660e0c34644504b324e830f2991d4865
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          installer="$RUNNER_TEMP/p3-node32-lean-installer"
          mv .ci-lean-action "$installer"
          "$installer/scripts/install_elan.sh" 2>&1 | tee "$RUNNER_TEMP/p3-node32/install.log"
      - name: Restore the existing pinned Lake cache
        id: lake-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}
      - name: Fetch the pinned Mathlib objects
        id: mathlib-cache
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee "$RUNNER_TEMP/p3-node32/mathlib-cache.log"
      - name: Compile, replay and audit the selected P3.2 composition
        run: python3 verification/verify_part3_continuation.py --group node32 --expected-head "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/p3-node32"
      - name: Retain built dependencies for the next incremental proof
        if: ${{ !cancelled() && steps.mathlib-cache.outcome == 'success' && steps.lake-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}
      - name: Preserve actual diagnostics and declarations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-node32-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p3-node32/
          if-no-files-found: error
          retention-days: 30
